<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — B&V Auto</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111827; color: #f9fafb;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { text-align: center; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #9ca3af; font-size: 0.9rem; }
    button { margin-top: 1.5rem; background: #2563eb; color: white; border: none;
             padding: 0.75rem 1.5rem; border-radius: 0.5rem; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:3rem">🔧</div>
    <h1>You're offline</h1>
    <p>Check your connection and try again.<br>Previously viewed jobs are still available.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
