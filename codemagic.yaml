workflows:

  # ── iOS → App Store ──────────────────────────────────────────────────────────
  ios-app-store:
    name: iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bvauto.app
      vars:
        BUNDLE_ID: com.bvauto.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: 0000000000   # ← replace with your App Store app ID after creating it in App Store Connect
      node: 22.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set version from package.json
        script: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD=$(($GOOGLE_PLAY_TRACK_BUILD_NUMBER + 1))
          agvtool new-marketing-version $VERSION
          agvtool new-version -all $BUILD
        working_directory: ios/App

      - name: Build iOS for App Store
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false   # set true when ready for full release

  # ── Android → Google Play ────────────────────────────────────────────────────
  android-play-store:
    name: Android Play Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - android_release_signing
        - google_play
      vars:
        PACKAGE_NAME: com.bvauto.app
      node: 22.11.0
      java: 17

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Sync Capacitor Android
        script: npx cap sync android

      - name: Prepare Android signing
        script: |
          python3 - <<'PY'
          import base64, os
          open('/tmp/bvauto-release.p12', 'wb').write(base64.b64decode(os.environ['BVAUTO_KEYSTORE_BASE64']))
          PY
          echo "BVAUTO_KEYSTORE_FILE=/tmp/bvauto-release.p12" >> $CM_ENV
          echo "BVAUTO_KEYSTORE_PASSWORD=$BVAUTO_KEYSTORE_PASSWORD" >> $CM_ENV
          echo "BVAUTO_KEY_ALIAS=$BVAUTO_KEY_ALIAS" >> $CM_ENV
          echo "BVAUTO_KEY_PASSWORD=$BVAUTO_KEY_PASSWORD" >> $CM_ENV

      - name: Build Android release AAB
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  # Build the signed APK that the in-app updater downloads. Push a tag such as
  # android-v1.7 (after bumping versionCode/versionName) or run this workflow
  # manually. With GITHUB_TOKEN available it commits the APK + metadata back to
  # master, which Vercel deploys and /api/app-version serves to installed apps.
  android-apk-update:
    name: Android In-App Update APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - android_release_signing
      vars:
        PACKAGE_NAME: com.bvauto.app
      node: 22.11.0
      java: 17

    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps

      - name: Sync Capacitor Android
        script: npx cap sync android

      - name: Prepare Android signing
        script: |
          python3 - <<'PY'
          import base64, os
          open('/tmp/bvauto-release.p12', 'wb').write(base64.b64decode(os.environ['BVAUTO_KEYSTORE_BASE64']))
          PY
          echo "BVAUTO_KEYSTORE_FILE=/tmp/bvauto-release.p12" >> $CM_ENV
          echo "BVAUTO_KEYSTORE_PASSWORD=$BVAUTO_KEYSTORE_PASSWORD" >> $CM_ENV
          echo "BVAUTO_KEY_ALIAS=$BVAUTO_KEY_ALIAS" >> $CM_ENV
          echo "BVAUTO_KEY_PASSWORD=$BVAUTO_KEY_PASSWORD" >> $CM_ENV

      - name: Build signed release APK
        script: |
          cd android
          ./gradlew assembleRelease

      - name: Publish APK + version metadata
        script: |
          cd ..
          node scripts/publish-android.mjs --skip-build --apk android/app/build/outputs/apk/release/app-release.apk
          if [ -n "$GITHUB_TOKEN" ]; then
            git config user.name "Codemagic"
            git config user.email "ci@codemagic.io"
            git add public/app-release.apk src/lib/android-release.json
            VERSION=$(node -p "require('./src/lib/android-release.json').versionName")
            git commit -m "chore: publish Android $VERSION"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/crissmobiss2/bv-auto.git" HEAD:master
          else
            echo "GITHUB_TOKEN is not set. Download the APK artifact and commit public/app-release.apk + src/lib/android-release.json."
          fi

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - public/app-release.apk

  # Verifies that the Codemagic signing variables can build and sign the APK.
  # Does not publish or change the served APK, so it is safe to run any time.
  android-signing-verify:
    name: Android Signing Verify
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      groups:
        - android_release_signing
      vars:
        PACKAGE_NAME: com.bvauto.app
      node: 22.11.0
      java: 17

    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps

      - name: Sync Capacitor Android
        script: npx cap sync android

      - name: Prepare Android signing
        script: |
          python3 - <<'PY'
          import base64, os
          open('/tmp/bvauto-release.p12', 'wb').write(base64.b64decode(os.environ['BVAUTO_KEYSTORE_BASE64']))
          PY
          echo "BVAUTO_KEYSTORE_FILE=/tmp/bvauto-release.p12" >> $CM_ENV
          echo "BVAUTO_KEYSTORE_PASSWORD=$BVAUTO_KEYSTORE_PASSWORD" >> $CM_ENV
          echo "BVAUTO_KEY_ALIAS=$BVAUTO_KEY_ALIAS" >> $CM_ENV
          echo "BVAUTO_KEY_PASSWORD=$BVAUTO_KEY_PASSWORD" >> $CM_ENV

      - name: Build signed release APK
        script: |
          cd android
          ./gradlew assembleRelease

      - name: Verify signer
        script: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
